  <path d="M130 211q0-11 11-11h88q11 0 11 11v9H130z" fill="#21536f"/>
  <path d="M142 205h84" stroke="#64a8c1" stroke-width="5" stroke-linecap="round"/>
  <rect x="157" y="190" width="27" height="13" rx="5" fill="#478dab"/>
  <rect x="195" y="190" width="27" height="13" rx="5" fill="#478dab"/>
  <path d="M224 249h98q36 0 36 33v33H224z" fill="url(#red)" stroke="#a83023" stroke-width="5"/>
  <path d="M236 256h80q15 0 23 10" fill="none" stroke="#ff9871" stroke-width="6" stroke-linecap="round"/>
  <path d="M292 210h35l-4 38h-27z" fill="#294541"/>
  <rect x="286" y="201" width="47" height="17" rx="6" fill="url(#gold)"/>
