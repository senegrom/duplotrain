  <path d="M135 310h228" stroke="#f66c45" stroke-width="5" stroke-linecap="round"/>
  <path d="m363 321 25 21h-37z" fill="#294541"/>
  <g fill="url(#gold)" stroke="#294541" stroke-width="9">
    <circle cx="166" cy="330" r="28"/>
    <circle cx="238" cy="330" r="28"/>
    <circle cx="321" cy="329" r="31"/>
  </g>
  <path d="M166 330h155" stroke="#ad7835" stroke-width="10" stroke-linecap="round"/>
  <path d="M166 327h155" stroke="#fff0bc" stroke-width="6" stroke-linecap="round"/>
