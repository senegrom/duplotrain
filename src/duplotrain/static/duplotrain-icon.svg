<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>duplotrain</title>
  <desc>A red toy locomotive with a blue cab and golden wheels on a looping track.</desc>
  <defs>
    <linearGradient id="green" x2=".8" y2="1">
      <stop stop-color="#315c48"/><stop offset="1" stop-color="#102e26"/>
    </linearGradient>
    <linearGradient id="ivory" x2=".65" y2="1">
      <stop stop-color="#fffdf1"/><stop offset="1" stop-color="#e9dec6"/>
    </linearGradient>
    <linearGradient id="red" x2="0" y2="1">
      <stop stop-color="#f46b45"/><stop offset=".5" stop-color="#df452d"/>
      <stop offset="1" stop-color="#ae2e23"/>
    </linearGradient>
    <linearGradient id="blue" x2=".7" y2="1">
      <stop stop-color="#478dab"/><stop offset="1" stop-color="#21536f"/>
    </linearGradient>
    <linearGradient id="gold" x2=".5" y2="1">
      <stop stop-color="#ffe4a0"/><stop offset="1" stop-color="#e6ad42"/>
    </linearGradient>
  </defs>
  <path fill="url(#green)" d="M0 0h512v512H0z"/>
  <rect x="72" y="80" width="380" height="384" rx="54" fill="#081e18" opacity=".4"/>
  <rect x="62" y="64" width="380" height="384" rx="54" fill="#a39778"/>
  <rect x="62" y="50" width="380" height="380" rx="54" fill="url(#ivory)"/>
  <rect x="74" y="62" width="356" height="356" rx="43" fill="none" stroke="#fffefa" stroke-width="4"/>
  <!-- The loop is a railway, with sleepers between its two rails. -->
  <rect x="112" y="122" width="282" height="258" rx="108" fill="none" stroke="#c4c8bf" stroke-width="30"/>
  <rect x="112" y="122" width="282" height="258" rx="108" fill="none" stroke="#929e95" stroke-width="30" stroke-dasharray="7 18"/>
  <rect x="98" y="108" width="310" height="286" rx="122" fill="none" stroke="#61766b" stroke-width="5"/>
  <rect x="126" y="136" width="254" height="230" rx="94" fill="none" stroke="#61766b" stroke-width="5"/>
  <!-- Soft steam puffs keep the silhouette playful without any lettering. -->
  <path d="M303 167c-12 0-20-8-20-18 0-10 8-18 20-18 3-15 16-23 30-18 11-14 34-12 41 4 19-2 31 20 19 34-6 7-13 9-25 7-8 13-24 15-35 7-10 9-22 10-30 2z" fill="#fffdf4"/>
  <ellipse cx="318" cy="186" rx="12" ry="9" fill="#fffdf4"/>
  <!-- A chunky toy engine: blue cab, red boiler, brass chimney and wheels. -->
  <path d="M135 319h238l16 22H129z" fill="#ab9e7f" opacity=".4"/>
