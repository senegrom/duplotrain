<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>duplotrain editor</title>
<meta name="theme-color" content="#163e32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="duplotrain">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="./icons/duplotrain-favicon-v1.ico" type="image/x-icon" sizes="16x16 32x32 48x48">
<link rel="icon" href="./icons/duplotrain-tab-16-v1.png" type="image/png" sizes="16x16">
<link rel="icon" href="./icons/duplotrain-tab-32-v1.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/duplotrain-apple-152-v1.png" sizes="152x152">
<link rel="apple-touch-icon" href="./icons/duplotrain-apple-167-v1.png" sizes="167x167">
<link rel="apple-touch-icon" href="./icons/duplotrain-apple-180-v1.png" sizes="180x180">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./editor.css">
</head>
<body>
<div id="side">
  <h1>duplotrain <small>track editor</small></h1>
  <div id="status" role="status" aria-live="polite">loading…</div>
  <div id="save-status" role="status"></div>
  <div id="actions">
    <button id="undo">↩ undo</button>
    <button id="clear" class="ghost">clear</button>
    <button id="export">⭳ export JSON</button>
    <button id="import">⭱ import JSON</button>
    <input id="importfile" type="file" accept=".json,application/json" style="display:none">
  </div>
  <h2>Close the loop</h2>
  <div class="solverow">
    <label>slop <input id="slop" type="number" min="0" step="0.5" value="0"> mm</label>
    <button id="solve" class="primary">Close the loop</button>
  </div>
  <label class="solverow" style="font-size:12px" title="also propose teardrops that close into a switch branch — the train then needs a direction-change stone on the open tail">
    <input id="reversing" type="checkbox"> allow reversing loops (uses the ↔ stone)
  </label>
  <label class="solverow">Search up to
    <input id="max-pieces" type="number" min="1" max="128" step="1" value="26"> added pieces
  </label>
  <button id="expand-search" hidden>Search deeper</button>
  <div id="cands"></div>
  <h2>Your sets <span style="font-weight:400">(one click adds its pieces)</span></h2>
  <div id="sets" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  <label class="solverow" style="font-size:12px" title="sandbox: ignore inventory limits — place anything, and the solver may draw from a bottomless box">
    <input id="unlimited" type="checkbox"> infinite pieces (sandbox)
  </label>
  <h2>Action stones <span style="font-weight:400">(arm one, click a straight)</span></h2>
  <div id="stones" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  <h2>Pieces <span style="font-weight:400">(arm one, then click a red arrow)</span></h2>
  <div id="palette"></div>
</div>
<div id="stage">
  <canvas id="canvas" aria-label="Track layout. Choose a piece, then tap an open end to attach it."></canvas>
  <div id="toolbar" role="toolbar" aria-label="Canvas controls">
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="fit">Fit layout</button>
    <button id="delete-tool" aria-pressed="false">Remove</button>
  </div>
  <div id="hint">drag: pan · pinch / wheel / + −: zoom · red arrow: attach · Remove: tap a piece</div>
</div>
<!-- Worker boot is inserted here by the static build. -->
<script src="./editor.js" defer></script>

</body>
</html>
