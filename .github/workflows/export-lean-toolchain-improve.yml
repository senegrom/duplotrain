name: Export Lean toolchain for improve-linear-bound
on:
  push:
    branches: [agent/improve-linear-bound]
    paths:
      - .github/workflows/export-lean-toolchain-improve.yml
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
      - name: Archive toolchain
        run: |
          tar -C "$HOME/.elan/toolchains" -czf /tmp/lean-v4.32.2.tar.gz leanprover--lean4---v4.32.2
      - uses: actions/upload-artifact@v4
        with:
          name: lean-v4.32.2-toolchain
          path: /tmp/lean-v4.32.2.tar.gz
          compression-level: 0
          retention-days: 1
