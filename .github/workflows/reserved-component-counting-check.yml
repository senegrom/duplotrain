name: Reserved component counting Lean check
on:
  push:
    branches: [agent/linear-bound-current]
    paths:
      - theory/lean/TreeCapacityTwoThirds.lean
      - theory/lean/ReservedComponentCounting.lean
      - .github/workflows/reserved-component-counting-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register theorem targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "TreeCapacityTwoThirds"
          [[lean_lib]]
          name = "ReservedComponentCounting"
          EOF
      - name: Build reserved-cell theorems
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build TreeCapacityTwoThirds ReservedComponentCounting
