name: Corrected block-sparse proof check
on:
  push:
    branches: [agent/linear-bound-current]
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build established bases
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build ThreeQuarterArithmetic SupportMove HiddenAbsorb
      - name: Check corrected counting core
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean BlockSparseBoundCore.lean
          lake env lean BlockSparseFixedCountCore.lean
          lake env lean EndpointAccountingStandalone.lean
          lake env lean BlockAbstractEpochBoundCore.lean
