name: Push below coefficient 14
on:
  push:
    branches: [agent/push-below-14]
    paths:
      - theory/lean/TrackEarlyRepairSharp.lean
      - theory/lean/TrackStayContactAllTime.lean
      - theory/lean/PairTongueCountAbsoluteFour.lean
      - theory/lean/KnownEdgeEleven.lean
      - theory/lean/StateLawEleven.lean
      - .github/workflows/push-below-14-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register experimental targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "TrackEarlyRepairSharp"
          [[lean_lib]]
          name = "TrackStayContactAllTime"
          [[lean_lib]]
          name = "PairTongueCountAbsoluteFour"
          [[lean_lib]]
          name = "KnownEdgeEleven"
          [[lean_lib]]
          name = "StateLawEleven"
          EOF
      - name: Build available targets
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build TrackEarlyRepairSharp
          lake build TrackStayContactAllTime
          lake build PairTongueCountAbsoluteFour
          if [ -f KnownEdgeEleven.lean ]; then lake build KnownEdgeEleven; fi
          if [ -f StateLawEleven.lean ]; then lake build StateLawEleven; fi
