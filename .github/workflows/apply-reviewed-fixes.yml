name: Apply reviewed fixes
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-reviewed-fixes.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reassemble and verify the locally tested patch
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          patch = b''.join(p.read_bytes() for p in sorted(Path('.github/review-fixes').glob('*.patch')))
          # Remove the duplicated assertion introduced while transferring part 04.
          line = b'+  assert.equal(store.writes.length, 2);\n'
          patch = patch.replace(line + line, line)
          expected = 'a37810d6a7e0d2d39d1b8f5e1f540f154a792825db302f072bcbc3d29f530fb3'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch checksum mismatch'
          Path('/tmp/review-fixes.patch').write_bytes(patch)
      - name: Apply checked source changes
        run: |
          git apply --check /tmp/review-fixes.patch
          git apply /tmp/review-fixes.patch
          git diff --check
          test -z "$(git diff --name-only -- theory)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src webapp tests/browser tests/test_browser_policy.py tests/test_joint_geometry.py
      - run: python -m pytest tests/test_browser_policy.py tests/test_joint_geometry.py
      - run: node --test tests/web/*.test.cjs
      - name: Commit validated source without modifying workflows
        run: |
          git rm -r .github/review-fixes
          git add src webapp tests README.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix autosave races, geometric closure validation and strict browser testing'
          git push origin HEAD:main
