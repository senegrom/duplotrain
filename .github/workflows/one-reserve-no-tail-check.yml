name: One-reserve no-tail Lean check
on:
  push:
    branches: [agent/linear-bound-current]
    paths:
      - theory/lean/ExternalLobeRoundtrip.lean
      - theory/lean/ExternalLobeReflectionCore.lean
      - theory/lean/FullyLobedComponentTrap.lean
      - theory/lean/OneReserveFromNoTail.lean
      - .github/workflows/one-reserve-no-tail-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register theorem targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "ExternalLobeRoundtrip"
          [[lean_lib]]
          name = "ExternalLobeReflectionCore"
          [[lean_lib]]
          name = "FullyLobedComponentTrap"
          [[lean_lib]]
          name = "OneReserveFromNoTail"
          EOF
      - name: Build reserve theorem
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build ExternalLobeRoundtrip ExternalLobeReflectionCore FullyLobedComponentTrap OneReserveFromNoTail
