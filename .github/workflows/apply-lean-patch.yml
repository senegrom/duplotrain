name: Apply Lean patch

on:
  push:
    branches: [agent/push-below-5]
    paths:
      - .github/workflows/apply-lean-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply boundary-tail vector transport patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('theory/lean/BoundaryOverlapTailCount.lean')
          text = path.read_text()
          old = '''        have hshift := tonguesAt_add_of_reaches
                    hreach ⟨finish, htailRun⟩
                  simp only [Function.comp_apply]
                  unfold restrictedTonguesAt
                  rw [hkEq]
                  exact congrArg (VectorCount.restrict N) hshift.symm
          '''
          new = '''        have hshift := tonguesAt_add_of_reaches
                    hreach ⟨finish, htailRun⟩
                  have hstartEq :
                      tonguesAt w start (lead + (k - lead)) =
                        tonguesAt w start k := by
                    rw [← hkEq]
                  simp only [Function.comp_apply]
                  unfold restrictedTonguesAt
                  exact congrArg (VectorCount.restrict N)
                    (hshift.symm.trans hstartEq)
          '''
          if old not in text:
              raise SystemExit('boundary transport block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add theory/lean/BoundaryOverlapTailCount.lean
          git diff --cached --check
          git commit -m "fix boundary-tail transport [skip ci]"
          git push origin HEAD:agent/push-below-5
