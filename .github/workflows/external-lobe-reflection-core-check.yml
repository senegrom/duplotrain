name: External lobe reflection core Lean check
on:
  push:
    branches: [agent/linear-bound-current]
    paths:
      - theory/lean/ExternalLobeRoundtrip.lean
      - theory/lean/ExternalLobeReflectionCore.lean
      - .github/workflows/external-lobe-reflection-core-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register theorem targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "ExternalLobeRoundtrip"
          [[lean_lib]]
          name = "ExternalLobeReflectionCore"
          EOF
      - name: Build reflection core
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build ExternalLobeRoundtrip ExternalLobeReflectionCore
