name: State law N+4
on:
  push:
    branches: [main]
    paths:
      - theory/lean/**
      - .github/workflows/state-law-check.yml
  pull_request:
    paths:
      - theory/lean/**
      - .github/workflows/state-law-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: state-law-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Lean
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # Official elan v4.2.4 Linux x86_64 asset digest (GitHub release metadata).
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 3 --connect-timeout 15 --max-time 120 \
            -o elan.tar.gz \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz" | sha256sum --check --strict
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build every library
        run: lake build
      - name: Audit the axioms of the sharp state law
        run: |
          set -euo pipefail
          lake build StateLawAxiomAudit 2>&1 | tee audit.log
          grep "'GeneralN.state_law' depends on axioms" audit.log
          if grep -q "sorryAx" audit.log; then
            echo "sorryAx detected" && exit 1
          fi
