name: Application checks
on:
  # Python proof helpers remain application inputs: tests import theory/*.py.
  push:
    branches: [main]
    paths-ignore:
      - 'theory/lean/**'
      - 'theory/paper/**'
      - 'theory/*.md'
  pull_request:
    paths-ignore:
      - 'theory/lean/**'
      - 'theory/paper/**'
      - 'theory/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive the exact source under test
        if: matrix.python == '3.12'
        run: git archive --format=zip HEAD -o source-under-test.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.python == '3.12'
        with:
          name: source-under-test
          path: source-under-test.zip
          retention-days: 3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src webapp tests
      - run: python -m pytest -m 'not slow and not browser'
  base-install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Exercise export with genuinely no optional rendering dependency
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('matplotlib') is None"
          duplotrain solve --curve 12 -o out --top 2
          python -c "from pathlib import Path; assert list(Path('out').glob('*.json')); assert not list(Path('out').glob('*.png'))"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: node --test tests/web/*.test.cjs
      - run: python webapp/build.py
      - run: python -m pytest tests/browser -m browser -v
        env:
          DUPLOTRAIN_REQUIRE_BROWSER: '1'
          DUPLOTRAIN_BROWSER: ${{ matrix.browser }}
          DUPLOTRAIN_STATIC_DIST: ${{ github.workspace }}/webapp/dist
  deploy:
    # Publish to GitHub Pages only from a push to main whose checks all passed,
    # at exactly the commit they ran on. Nothing here reads event data, so a
    # pull request from a fork can neither trigger this job nor choose the code
    # it builds; a separate workflow_run-triggered deploy could be reached by a
    # fork branch named main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [python, base-install, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # build.py re-verifies the archive's SHA-256 on every build.
          path: webapp/vendor/pyodide-core-0.27.7.tar.bz2
          key: pyodide-core-0.27.7
      - run: python webapp/build.py --pages
      - name: Check the bundle
        run: |
          set -euo pipefail
          test -f webapp/dist/index.html
          grep -q 'http-equiv="Content-Security-Policy"' webapp/dist/index.html
          ls webapp/dist/duplotrain-src-*.zip webapp/dist/pyodide-0.27.7/pyodide.asm.wasm
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: webapp/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
