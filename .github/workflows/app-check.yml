name: Application checks
on:
  push:
    branches: [main, fix/duplotrain-review]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact source under test
        if: matrix.python == '3.12'
        run: git archive --format=zip HEAD -o source-under-test.zip
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: source-under-test
          path: source-under-test.zip
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src webapp
      - run: python -m pytest -m 'not slow'
