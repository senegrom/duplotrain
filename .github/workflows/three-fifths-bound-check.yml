name: Three-fifths loaded-component Lean check
on:
  push:
    branches: [agent/linear-bound-current]
    paths:
      - theory/lean/TreeLobeLoadThreeFifths.lean
      - theory/lean/LobePartnerBounce.lean
      - theory/lean/LobeToggle.lean
      - .github/workflows/three-fifths-bound-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register theorem targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "TreeCapacitySevenTenths"
          [[lean_lib]]
          name = "TreeLobeLoadThreeFifths"
          [[lean_lib]]
          name = "LobePartnerBounce"
          [[lean_lib]]
          name = "LobeToggle"
          EOF
      - name: Build three-fifths theorem
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build TreeLobeLoadThreeFifths LobePartnerBounce LobeToggle
