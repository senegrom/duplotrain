name: Improved component bounds Lean check
on:
  push:
    branches: [agent/linear-bound-current]
    paths:
      - theory/lean/TreeLobeLoadThreeFifths.lean
      - theory/lean/TreeLobeNotFullTwoThirds.lean
      - theory/lean/LobePartnerBounce.lean
      - theory/lean/LobeToggle.lean
      - theory/lean/TwoReflectorEdgeTrap.lean
      - theory/lean/TwoReflectorFiniteTrap.lean
      - theory/lean/LobeVariationVisit.lean
      - theory/lean/FullyLoadedTreeImpossible.lean
      - theory/lean/TreeLobeLoadBound.lean
      - theory/lean/LoadedTreeGroupsTwoThirds.lean
      - theory/lean/LoadedTreeGroupBudget.lean
      - theory/lean/LoadedTreeGroupsWithFreeTwoThirds.lean
      - theory/lean/AutomaticLoadedTwoThirds.lean
      - .github/workflows/three-fifths-bound-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register theorem targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "TreeCapacitySevenTenths"
          [[lean_lib]]
          name = "TreeLobeLoadThreeFifths"
          [[lean_lib]]
          name = "TreeLobeNotFullTwoThirds"
          [[lean_lib]]
          name = "LobePartnerBounce"
          [[lean_lib]]
          name = "LobeToggle"
          [[lean_lib]]
          name = "TwoReflectorEdgeTrap"
          [[lean_lib]]
          name = "TwoReflectorFiniteTrap"
          [[lean_lib]]
          name = "LobeVariationVisit"
          [[lean_lib]]
          name = "FullyLoadedTreeImpossible"
          [[lean_lib]]
          name = "TreeLobeLoadBound"
          [[lean_lib]]
          name = "LoadedTreeGroupsTwoThirds"
          [[lean_lib]]
          name = "LoadedTreeGroupBudget"
          [[lean_lib]]
          name = "LoadedTreeGroupsWithFreeTwoThirds"
          [[lean_lib]]
          name = "AutomaticLoadedTwoThirds"
          EOF
      - name: Build improved component bounds
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build TreeLobeLoadThreeFifths TreeLobeNotFullTwoThirds LobePartnerBounce LobeToggle TwoReflectorEdgeTrap TwoReflectorFiniteTrap LobeVariationVisit FullyLoadedTreeImpossible TreeLobeLoadBound LoadedTreeGroupsTwoThirds LoadedTreeGroupBudget LoadedTreeGroupsWithFreeTwoThirds AutomaticLoadedTwoThirds
