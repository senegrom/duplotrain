name: Add two-history legacy compatibility

on:
  push:
    branches: [agent/upper-bound-unified]
    paths:
      - .github/workflows/add-two-history-legacy-compat.yml

permissions:
  contents: write

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolate original legacy contact calculus
        run: |
          git show d615f15a2249933dc27d528ac6b4c87b508a4f7e:theory/lean/TwoHistoryUnionCharge.lean \
            > theory/lean/TwoHistoryUnionChargeLegacy.lean

          python - <<'PY'
          from pathlib import Path

          target = Path('theory/lean/MellitFiveNoveltyAssembly.lean')
          text = target.read_text()
          text = text.replace(
              'import TwoHistoryUnionCharge\nimport TwoHistoryUnionChargeLegacy\n',
              'import TwoHistoryUnionChargeLegacy\n',
              1,
          )
          text = text.replace(
              'Legacy.SecondHistoryContactData',
              'SecondHistoryContactData',
          )
          target.write_text(text)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add theory/lean/TwoHistoryUnionChargeLegacy.lean theory/lean/MellitFiveNoveltyAssembly.lean
          git diff --cached --check
          git commit -m "isolate legacy contact calculus for 2N+5 proof"
          git push origin HEAD:agent/upper-bound-unified
