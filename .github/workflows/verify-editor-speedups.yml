name: Verify editor speedups
on:
  push:
    branches: [main]
    paths:
      - .github/editor-speedups/**
      - .github/workflows/verify-editor-speedups.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-editor-speedups-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python .github/editor-speedups/apply.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src webapp tests
      - run: python -m pytest -m 'not slow and not browser'
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python .github/editor-speedups/apply.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: node --test tests/web/*.test.cjs
      - run: python webapp/build.py
      - run: python -m pytest tests/browser -m browser -v
        env:
          DUPLOTRAIN_REQUIRE_BROWSER: '1'
          DUPLOTRAIN_BROWSER: ${{ matrix.browser }}
          DUPLOTRAIN_STATIC_DIST: ${{ github.workspace }}/webapp/dist
  prepare:
    needs: [python, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the tested commit without changing main
        run: python .github/editor-speedups/prepare.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-editor-commit
          path: ${{ runner.temp }}/verified-commit.json
          retention-days: 3
