name: Coefficient one current
on:
  push:
    branches: [agent/coefficient-one-current]
    paths:
      - theory/lean/TripleSelfLinkSimpleCycleTail.lean
      - theory/lean/TripleSelfLinkSimpleCycleNoTail.lean
      - theory/lean/TraceRetainingFirstRevisit.lean
      - theory/lean/TraceRetainingBABASecondRepeat.lean
      - theory/lean/CoefficientOneSeven.lean
      - theory/lean/ProbeSimpleCycleTail.lean
      - theory/lean/COEFFICIENT_ONE_STATUS.md
      - UPPER_BOUND_PROGRESS.md
      - .github/workflows/coefficient-one-current-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register proof targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "TraceRetainingFirstRevisit"

          [[lean_lib]]
          name = "TraceRetainingBABASecondRepeat"
          EOF
      - name: Build proof targets
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build TripleSelfLinkSimpleCycleTail
          lake build SharpSixEventAssembly
          lake build TraceRetainingFirstRevisit
          lake build TraceRetainingBABASecondRepeat
          lake env lean CoefficientOneSeven.lean
          lake env lean ProbeSimpleCycleTail.lean
      - name: Publish proof checkpoint
        if: success()
        run: |
          {
            echo "## Coefficient-one proof checkpoint"
            echo
            echo "Kernel-checked theorem chain:"
            echo "- rawTwoVectorTail_of_stable_simple_cycle_exact"
            echo "- RawCycleThroughSelfLink.close_tail_of_simple_cycle_trace_exact"
            echo "- RawSixEventReduction.tail_simple_cycle_false"
            echo "- RawSixEventReduction.tail_cycle_self_link_false"
            echo "- CertifiedEndpointEmptyABCABC.tail_self_link_endpoint_is_early"
            echo "- PhysicalTrace.first_revisit_trace_or_activated_reflector"
            echo "- rawExactLobeWrite_second_repeat_cycle_traces_or_pair"
            echo "- ReachedStableSimpleCycle.one_vector_tail"
            echo
            echo "Conditional quantitative bridge:"
            echo "- knownEdgeFiveRepeatedWriterNovelty_of_sharpSixEventResidueImpossible"
            echo "- knownEdge_distinct_le_N_add_six_of_fiveRepeatedWriterNovelty"
            echo "- stateLawNAddSeven_of_sharpSixEventResidueImpossible"
            echo
            echo "The selected self-link raw-cycle residual is closed."
            echo "The generic and BABA second-repeat APIs now retain the physical stable cycle lap needed for pointwise novelty accounting."
            echo "Closing the exact sharp six-event residue would yield N+7 globally (N+6 from a known incoming edge)."
            echo "The sharp N+6 StateLaw still requires the five-event/four-repeated-novelty closure."
          } >> "$GITHUB_STEP_SUMMARY"
