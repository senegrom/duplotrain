name: Push below coefficient 5
on:
  push:
    branches: [agent/push-below-5]
    paths:
      - theory/lean/FacingForwardConstant.lean
      - theory/lean/ProtectedRepairConstant.lean
      - theory/lean/KnownEdgeTwo.lean
      - theory/lean/KnownEdgeTwoAll.lean
      - theory/lean/KnownEdgeAllLift.lean
      - theory/lean/StateLawTwo.lean
      - theory/lean/RunwayHistoricalTwo.lean
      - theory/lean/ChangedFlipCountFive.lean
      - .github/workflows/push-below-5-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register new proof targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "FacingForwardConstant"
          [[lean_lib]]
          name = "ProtectedRepairConstant"
          [[lean_lib]]
          name = "KnownEdgeTwo"
          [[lean_lib]]
          name = "KnownEdgeTwoAll"
          [[lean_lib]]
          name = "KnownEdgeAllLift"
          [[lean_lib]]
          name = "StateLawTwo"
          [[lean_lib]]
          name = "RunwayHistoricalTwo"
          [[lean_lib]]
          name = "ChangedFlipCountFive"
          EOF
      - name: Build new proof targets
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build StateLawTwo ChangedFlipCountFive
