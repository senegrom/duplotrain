name: Push below coefficient 5
on:
  push:
    branches: [agent/push-below-5]
    paths:
      - theory/lean/OneJourneyTailCount.lean
      - theory/lean/KnownEdgeFour.lean
      - theory/lean/StateLawFour.lean
      - theory/lean/FirstCycleCount.lean
      - theory/lean/ChangedFlipCountActual.lean
      - theory/lean/ProtectedRepairThree.lean
      - theory/lean/KnownEdgeThree.lean
      - theory/lean/StateLawThree.lean
      - theory/lean/BoundaryOverlapTailCount.lean
      - theory/lean/TwoJourneyBoundaryTailCount.lean
      - theory/lean/KnownEdgeThreeSharp.lean
      - theory/lean/KnownEdgeLift.lean
      - theory/lean/StateLawThreeSharp.lean
      - theory/lean/SimpleTraceOneNetChange.lean
      - theory/lean/RepairLeadTwoPhase.lean
      - theory/lean/TwoPhasePrefixTailCount.lean
      - theory/lean/TrackEarlyRepairConstant.lean
      - .github/workflows/push-below-5-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register proof targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "OneJourneyTailCount"
          [[lean_lib]]
          name = "KnownEdgeFour"
          [[lean_lib]]
          name = "StateLawFour"
          [[lean_lib]]
          name = "FirstCycleCount"
          [[lean_lib]]
          name = "ChangedFlipCountActual"
          [[lean_lib]]
          name = "ProtectedRepairThree"
          [[lean_lib]]
          name = "KnownEdgeThree"
          [[lean_lib]]
          name = "StateLawThree"
          [[lean_lib]]
          name = "BoundaryOverlapTailCount"
          [[lean_lib]]
          name = "TwoJourneyBoundaryTailCount"
          [[lean_lib]]
          name = "KnownEdgeThreeSharp"
          [[lean_lib]]
          name = "KnownEdgeLift"
          [[lean_lib]]
          name = "StateLawThreeSharp"
          [[lean_lib]]
          name = "SimpleTraceOneNetChange"
          [[lean_lib]]
          name = "RepairLeadTwoPhase"
          [[lean_lib]]
          name = "TwoPhasePrefixTailCount"
          [[lean_lib]]
          name = "TrackEarlyRepairConstant"
          EOF
      - name: Build proof targets
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build OneJourneyTailCount KnownEdgeFour StateLawFour \
            FirstCycleCount ChangedFlipCountActual ProtectedRepairThree \
            KnownEdgeThree StateLawThree BoundaryOverlapTailCount \
            TwoJourneyBoundaryTailCount KnownEdgeThreeSharp KnownEdgeLift \
            StateLawThreeSharp SimpleTraceOneNetChange RepairLeadTwoPhase \
            TwoPhasePrefixTailCount TrackEarlyRepairConstant
