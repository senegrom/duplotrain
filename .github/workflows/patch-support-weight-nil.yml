name: Patch support-weight nil case
on:
  push:
    branches: [agent/linear-bound-current]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the zero-sum fibre base lemma
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("theory/lean/SupportWeightFibres.lean")
          text = path.read_text()

          lemma = """private theorem sum_map_zero_nat {α : Type}
              (xs : List α) :
              (xs.map (fun _ => 0)).sum = 0 := by
            induction xs with
            | nil => rfl
            | cons _ rest ih => simp [ih]

          """
          if "private theorem sum_map_zero_nat" not in text:
              marker = "/-- Integer fibres below `K` partition the list exactly. -/"
              pos = text.index(marker)
              text = text[:pos] + lemma + text[pos:]

          theorem_pos = text.index("theorem supportFibreSizes_sum")
          nil_pos = text.index("  | nil =>", theorem_pos)
          cons_pos = text.index("  | cons x rest ih =>", nil_pos)
          new_nil = """  | nil =>
              intro _
              unfold supportFibreSizes
              simpa [supportFibreSize] using
                (sum_map_zero_nat (List.range K))
          """
          text = text[:nil_pos] + new_nil + text[cons_pos:]
          path.write_text(text)
          PY
      - name: Commit repair
        run: |
          if ! git diff --quiet -- theory/lean/SupportWeightFibres.lean; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add theory/lean/SupportWeightFibres.lean
            git commit -m "factor the support-fibre zero-sum base case"
            git push origin HEAD:agent/linear-bound-current
          fi
