name: Verify proof simplification
on:
  push:
    branches: [main]
    paths: [.github/workflows/proof-workspace.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reproduce the exact locally checked source edits
        shell: python
        run: |
          import base64, hashlib, json, zlib
          from pathlib import Path
          encoded = (
            ''
            ''
          )
          payload = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(payload).hexdigest() == '3eb5c214898b53cbb32d43841567916304cee23650fdaabf0591ea0505390be4'
          prepared = []
          for name, before, edits, after in json.loads(payload):
              path = Path(name)
              assert path.parts[0] == 'theory' and '..' not in path.parts
              assert not path.is_symlink()
              if before is None:
                  assert not path.exists(), name
                  old = b''
              else:
                  old = path.read_bytes()
                  assert hashlib.sha256(old).hexdigest() == before, name
              lines = old.decode().splitlines(keepends=True)
              for a, b, replacement in reversed(edits):
                  lines[a:b] = replacement.splitlines(keepends=True)
              result = ''.join(lines).encode()
              assert hashlib.sha256(result).hexdigest() == after, name
              prepared.append((path, result))
          for path, result in prepared:
              path.write_bytes(result)
          print(f'Reproduced and verified {len(prepared)} exact proof/documentation files.')
      - name: Install pinned Lean
        working-directory: theory/lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check every proof and the exact axiom list from a clean build
        working-directory: theory/lean
        run: |
          lake build
          lake build StateLawAxiomAudit
      - name: Commit only the checked proof and documentation
        run: |
          git diff --check
          test -z "$(git diff --name-only -- src webapp tests .github)"
          git add theory
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Simplify protected-pair state law with one history and endpoint agreement'
          git push origin HEAD:main
