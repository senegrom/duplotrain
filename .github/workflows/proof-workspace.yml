name: Prepare proof workspace
on:
  push:
    branches: [main]
    paths: [.github/workflows/proof-workspace.yml]
permissions:
  contents: read
  actions: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pinned-proof-workspace
          run-id: 34020920692
          github-token: ${{ github.token }}
      - name: Split the verified workspace without changing its contents
        run: split -b 240M -d lean-workspace.tar.gz lean-part-
      - uses: actions/upload-artifact@v4
        with:
          name: lean-part-00
          path: |
            lean-part-00
            proof-sources.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: lean-part-01
          path: lean-part-01
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: lean-part-02
          path: lean-part-02
          retention-days: 1
          compression-level: 0
