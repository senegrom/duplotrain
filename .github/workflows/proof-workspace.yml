name: Prepare proof workspace
on:
  push:
    branches: [main]
    paths: [.github/workflows/proof-workspace.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the exact pinned toolchain
        working-directory: theory/lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          cd "$(lean --print-prefix)"
          find lib -name '*.olean.server' -print0 | tar --null -T - -czf "$GITHUB_WORKSPACE/lean-server-interfaces.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: lean-server-interfaces
          path: lean-server-interfaces.tar.gz
          retention-days: 1
          compression-level: 0
