name: Publish verified 14544-line proof
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-proof-14544.yml]
permissions:
  contents: read
jobs:
  verify-and-publish:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply exact reviewed proof patch
        shell: python
        run: |
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          patch = lzma.decompress(base64.b64decode(Path('.github/proof-linecount-main/payload.b64').read_bytes(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3bd8d4f4dca234ee204fb427b17c2588f2c46140cd047146a086243bedb2bec0'
          Path('/tmp/proof.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/proof.patch'], check=True)
          subprocess.run(['git','apply','/tmp/proof.patch'], check=True)
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          assert len(changed) == 9 and all(p.startswith('theory/lean/') for p in changed), changed
          files = list(Path('theory/lean').glob('*.lean'))
          lines = sum(len(p.read_text().splitlines()) for p in files)
          assert len(files) == 47 and lines == 14544, (len(files), lines)
          subprocess.run(['git','diff','--check'], check=True)
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --connect-timeout 15 --max-time 120 -o elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz" | sha256sum --check --strict
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clean Lean build and exact axiom audit
        working-directory: theory/lean
        run: |
          set -euo pipefail
          lake build
          lake env lean StateLawAxiomAudit.lean 2>&1 | tee audit.log
          grep -F "'GeneralN.state_law' depends on axioms: [propext, Classical.choice, Quot.sound]" audit.log
          if grep -q sorryAx audit.log; then exit 1; fi
      - name: Publish theory-only verified result and remove temporary publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- src webapp tests docs)"
          git rm .github/workflows/publish-proof-14544.yml .github/proof-linecount-main/payload.b64
          git add theory/lean
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reduce Lean proof bookkeeping and unify two-phase tails: 14903 -> 14544 lines'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
