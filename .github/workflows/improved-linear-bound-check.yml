name: Improved linear bound Lean check
on:
  push:
    branches: [agent/improve-linear-bound]
    paths:
      - theory/lean/FirstActivatedExact.lean
      - theory/lean/NoveltyAwareLasso.lean
      - theory/lean/KnownEdgeTwentyFour.lean
      - theory/lean/StateLawTwentyFour.lean
      - .github/workflows/improved-linear-bound-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register proof targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "FirstActivatedExact"
          [[lean_lib]]
          name = "NoveltyAwareLasso"
          [[lean_lib]]
          name = "KnownEdgeTwentyFour"
          [[lean_lib]]
          name = "StateLawTwentyFour"
          EOF
      - name: Build improved bound
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build StateLawTwentyFour
