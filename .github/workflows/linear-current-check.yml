name: Linear current Lean check
on:
  push:
    branches: [agent/linear-bound-current]
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and pinned Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proof targets
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build LinearBound AlternationBound SlotBound ReplayFacts PairBound SupportBound SupportMove EdgeReversal ReversalFacts MonotoneSupport HiddenFibre HiddenAbsorb HiddenDichotomy ThreeQuarterArithmetic ComponentCapacity ProfileCodeBound SupportSize LobeAbsorption EpochAggregation TreeReplay TreeEpochCode RootRank StarIndependent ActiveLobes FixedSupportBound GrayTailCount
