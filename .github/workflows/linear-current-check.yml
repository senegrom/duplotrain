name: Linear current Lean check
on:
  push:
    branches: [agent/linear-bound-current]
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Upload Lean source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lean-source
          path: theory/lean
          include-hidden-files: true
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Archive pinned Lean toolchain
        run: |
          tar -C "$HOME/.elan/toolchains" -czf /tmp/lean-toolchain.tar.gz \
            leanprover--lean4---v4.32.2
      - name: Upload pinned Lean toolchain
        uses: actions/upload-artifact@v4
        with:
          name: lean-toolchain
          path: /tmp/lean-toolchain.tar.gz
          compression-level: 0
      - name: Build proof targets
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build LinearBound AlternationBound SlotBound ReplayFacts PairBound SupportBound SupportMove EdgeReversal ReversalFacts MonotoneSupport HiddenFibre HiddenAbsorb HiddenDichotomy ThreeQuarterArithmetic ComponentCapacity ProfileCodeBound SupportSize LobeAbsorption EpochAggregation TreeReplay TreeEpochCode RootRank
