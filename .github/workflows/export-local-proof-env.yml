name: Export local proof environment
on:
  push:
    branches: [agent/push-below-14]
    paths:
      - .github/workflows/export-local-proof-env.yml
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat theory/lean/lean-toolchain)"
      - name: Archive source
        run: tar --exclude='.git' -czf /tmp/duplotrain-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: duplotrain-source
          path: /tmp/duplotrain-source.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Archive pinned Lean toolchain
        run: |
          tar -C "$HOME/.elan/toolchains" -czf /tmp/lean-toolchain.tar.gz leanprover--lean4---v4.32.2
      - uses: actions/upload-artifact@v4
        with:
          name: lean-toolchain
          path: /tmp/lean-toolchain.tar.gz
          compression-level: 0
          retention-days: 1
