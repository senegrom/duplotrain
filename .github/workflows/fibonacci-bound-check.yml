name: Fibonacci and component strict-bound Lean chain
on:
  push:
    branches: [agent/linear-bound-current]
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register source-level bridge and improved bound modules
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "RelevantFiniteFrame"
          [[lean_lib]]
          name = "RelevantCanonicalFrame"
          [[lean_lib]]
          name = "FiniteListBounds"
          [[lean_lib]]
          name = "ConcreteEchoBridge"
          [[lean_lib]]
          name = "ConcreteCascadeFacts"
          [[lean_lib]]
          name = "ConcreteFiniteBounds"
          [[lean_lib]]
          name = "DescentSimplicity"
          [[lean_lib]]
          name = "DescentRouteCatalogue"
          [[lean_lib]]
          name = "ConcreteTreeCodes"
          [[lean_lib]]
          name = "ConcreteEchoMachine"
          [[lean_lib]]
          name = "ConcreteTreeDisjoint"
          [[lean_lib]]
          name = "ConcreteTreeRetrace"
          [[lean_lib]]
          name = "ConcreteEchoStep"
          [[lean_lib]]
          name = "ConcreteAscentTrace"
          [[lean_lib]]
          name = "ConcreteTraceRegisters"
          [[lean_lib]]
          name = "ConcreteCertifiedEchoRun"
          [[lean_lib]]
          name = "OverwriteDynamics"
          [[lean_lib]]
          name = "OverwriteLasso"
          [[lean_lib]]
          name = "EchoConfiguration"
          [[lean_lib]]
          name = "DeterministicOverwriteReturn"
          [[lean_lib]]
          name = "TwoStateConfigurationFibre"
          [[lean_lib]]
          name = "ObservedConfigurationFibre"
          [[lean_lib]]
          name = "CanonicalConfigurationRepresentatives"
          [[lean_lib]]
          name = "PhysicalPrefixFibre"
          [[lean_lib]]
          name = "PhysicalPrefixCount"
          [[lean_lib]]
          name = "ConcretePhysicalBridge"
          [[lean_lib]]
          name = "FibonacciSparseBound"
          [[lean_lib]]
          name = "SupportRelativeFibonacciEpochBound"
          [[lean_lib]]
          name = "CanonicalFibonacciEpochBound"
          [[lean_lib]]
          name = "RelevantCertifiedFibonacciEpochBound"
          [[lean_lib]]
          name = "FibonacciCapacityMonotone"
          [[lean_lib]]
          name = "RelevantFibonacciGlobalBound"
          [[lean_lib]]
          name = "RelevantFibonacciNBound"
          [[lean_lib]]
          name = "RelevantFibonacciConfigBound"
          [[lean_lib]]
          name = "RelevantFibonacciPhysicalBound"
          [[lean_lib]]
          name = "RelevantEdgeRepresentativeSupport"
          [[lean_lib]]
          name = "RelevantEdgeFibonacciGlobalBound"
          [[lean_lib]]
          name = "RelevantEdgeFibonacciConfigBound"
          [[lean_lib]]
          name = "RelevantEdgeFibonacciPhysicalBound"
          [[lean_lib]]
          name = "FullComponentRootUniqueness"
          [[lean_lib]]
          name = "TreeCapacitySevenTenths"
          EOF
      - name: Build improved bound endpoints
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build RelevantEdgeFibonacciPhysicalBound FullComponentRootUniqueness TreeCapacitySevenTenths
