name: Deploy web app
on:
  # Deploy only a commit whose Application checks passed on main. Those checks
  # run for every push that touches the application, so nothing app-relevant
  # slips by; theory-only pushes neither run them nor need a deploy.
  workflow_run:
    workflows: ["Application checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit the checks passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # First run creates the Pages site (source: GitHub Actions); later runs are no-ops.
          enablement: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # build.py re-verifies the archive's SHA-256 on every build.
          path: webapp/vendor/pyodide-core-0.27.7.tar.bz2
          key: pyodide-core-0.27.7
      - run: python webapp/build.py --pages
      - name: Check the bundle
        run: |
          set -euo pipefail
          test -f webapp/dist/index.html
          grep -q 'http-equiv="Content-Security-Policy"' webapp/dist/index.html
          ls webapp/dist/duplotrain-src-*.zip webapp/dist/pyodide-0.27.7/pyodide.asm.wasm
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: webapp/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
