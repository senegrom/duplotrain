name: Upper bound unified
on:
  push:
    branches: [agent/upper-bound-unified]
    paths:
      - theory/lean/**
      - UPPER_BOUND_PROGRESS.md
      - .github/workflows/upper-bound-unified-check.yml
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register all Lean modules
        run: |
          register_target() {
            target="$1"
            if ! grep -Fq "name = \"$target\"" lakefile.toml; then
              {
                echo
                echo '[[lean_lib]]'
                echo "name = \"$target\""
              } >> lakefile.toml
            fi
          }
          for source in *.lean; do
            register_target "${source%.lean}"
          done
      - name: Check strongest unconditional bound endpoints
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build StateLawTwoSharper CodexStateLawTwoSharp MellitFiveNoveltyAssembly StateLawTwoFive
      - name: Check continuation compression
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build OneReflectorContinuation
      - name: Check coefficient-one quantitative reductions
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build ContactHistorySharpBound CoefficientOneSeven
      - name: Check trace-retaining cycle closures
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build TripleSelfLinkSimpleCycleTail PointwiseSimpleCycleTail TraceRetainingFirstRevisit TraceRetainingBABASecondRepeat
      - name: Check imported structural modules
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build EchoRawBridgeSharp EmptyCurvePotential MellitDynamicResidual StateLawParametricAudit TwoHistoryUnionCharge
      - name: Publish proof checkpoint
        if: success()
        run: |
          {
            echo "## Unified upper-bound checkpoint"
            echo
            echo "Kernel-checked unconditional endpoint in this tree:"
            echo "- known incoming edge: 2N+4"
            echo "- arbitrary start: 2N+5"
            echo
            echo "Continuation compression:"
            echo "- one reflector plus a support-preserving continuation is checked"
            echo
            echo "Coefficient-one frontier:"
            echo "- conditional N+7 assembly checked"
            echo "- pointwise simple-cycle tail checked"
            echo "- first old-support contact reduced to the unchanged-forward two-novelty law"
          } >> "$GITHUB_STEP_SUMMARY"
