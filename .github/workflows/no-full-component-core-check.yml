name: No-full component core Lean check
on:
  push:
    branches: [agent/linear-bound-current]
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build established bases
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build SupportMove HiddenAbsorb
      - name: Check standalone accounting and freezing
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean EndpointAccountingStandalone.lean
          lake env lean NoFullFreezeCore.lean
          lake env lean NoFullComponentFreezeCore.lean
