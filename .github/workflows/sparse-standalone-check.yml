name: Standalone sparse combinatorics Lean check
on:
  push:
    branches: [agent/linear-bound-current]
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build arithmetic base
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build ThreeQuarterArithmetic
      - name: Check standalone sparse theorem
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean SparseCombinatorics.lean
