name: Tighten linear overlap Lean check
on:
  push:
    branches: [agent/tighten-linear-beyond-24]
    paths:
      - theory/lean/NoveltyAwareLassoOverlap.lean
      - theory/lean/KnownEdgeTwentyFourOverlap.lean
      - theory/lean/StateLawTwentyFourOverlap.lean
      - theory/lean/TrackQuantitativeRouteSharp.lean
      - theory/lean/NoveltyAwareLassoTwentyThree.lean
      - theory/lean/KnownEdgeTwentyThree.lean
      - theory/lean/StateLawTwentyThree.lean
      - .github/workflows/tighten-linear-overlap-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register theorem targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "NoveltyAwareLassoOverlap"
          [[lean_lib]]
          name = "KnownEdgeTwentyFourOverlap"
          [[lean_lib]]
          name = "StateLawTwentyFourOverlap"
          [[lean_lib]]
          name = "TrackQuantitativeRouteSharp"
          [[lean_lib]]
          name = "NoveltyAwareLassoTwentyThree"
          [[lean_lib]]
          name = "KnownEdgeTwentyThree"
          [[lean_lib]]
          name = "StateLawTwentyThree"
          EOF
      - name: Build tightened linear theorems
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build NoveltyAwareLassoOverlap
          lake build KnownEdgeTwentyFourOverlap
          lake build StateLawTwentyFourOverlap
          if [ -f TrackQuantitativeRouteSharp.lean ]; then lake build TrackQuantitativeRouteSharp; fi
          if [ -f NoveltyAwareLassoTwentyThree.lean ]; then lake build NoveltyAwareLassoTwentyThree; fi
          if [ -f KnownEdgeTwentyThree.lean ]; then lake build KnownEdgeTwentyThree; fi
          if [ -f StateLawTwentyThree.lean ]; then lake build StateLawTwentyThree; fi
