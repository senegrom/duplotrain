name: Tighten linear overlap Lean check
on:
  push:
    branches: [agent/tighten-linear-beyond-24]
    paths:
      - theory/lean/NoveltyAwareLassoOverlap.lean
      - theory/lean/KnownEdgeTwentyFourOverlap.lean
      - theory/lean/StateLawTwentyFourOverlap.lean
      - theory/lean/TrackQuantitativeRouteSharp.lean
      - theory/lean/NoveltyAwareLassoTwentyThree.lean
      - theory/lean/KnownEdgeTwentyThree.lean
      - theory/lean/StateLawTwentyThree.lean
      - theory/lean/TrackThetaSharp.lean
      - theory/lean/TrackQuantitativeRepairNineteen.lean
      - theory/lean/NoveltyAwareLassoTwentyOne.lean
      - theory/lean/KnownEdgeTwentyOne.lean
      - theory/lean/StateLawTwentyOne.lean
      - theory/lean/TrackThetaCaptureSharp.lean
      - theory/lean/TrackThetaSharper.lean
      - theory/lean/TrackQuantitativeRepairEighteen.lean
      - theory/lean/NoveltyAwareLassoTwenty.lean
      - theory/lean/KnownEdgeTwenty.lean
      - theory/lean/StateLawTwenty.lean
      - .github/workflows/tighten-linear-overlap-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register theorem targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "NoveltyAwareLassoOverlap"
          [[lean_lib]]
          name = "KnownEdgeTwentyFourOverlap"
          [[lean_lib]]
          name = "StateLawTwentyFourOverlap"
          [[lean_lib]]
          name = "TrackQuantitativeRouteSharp"
          [[lean_lib]]
          name = "NoveltyAwareLassoTwentyThree"
          [[lean_lib]]
          name = "KnownEdgeTwentyThree"
          [[lean_lib]]
          name = "StateLawTwentyThree"
          [[lean_lib]]
          name = "TrackThetaSharp"
          [[lean_lib]]
          name = "TrackQuantitativeRepairNineteen"
          [[lean_lib]]
          name = "NoveltyAwareLassoTwentyOne"
          [[lean_lib]]
          name = "KnownEdgeTwentyOne"
          [[lean_lib]]
          name = "StateLawTwentyOne"
          [[lean_lib]]
          name = "TrackThetaCaptureSharp"
          [[lean_lib]]
          name = "TrackThetaSharper"
          [[lean_lib]]
          name = "TrackQuantitativeRepairEighteen"
          [[lean_lib]]
          name = "NoveltyAwareLassoTwenty"
          [[lean_lib]]
          name = "KnownEdgeTwenty"
          [[lean_lib]]
          name = "StateLawTwenty"
          EOF
      - name: Build tightened linear theorems
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build NoveltyAwareLassoOverlap
          lake build KnownEdgeTwentyFourOverlap
          lake build StateLawTwentyFourOverlap
          lake build TrackQuantitativeRouteSharp
          lake build NoveltyAwareLassoTwentyThree
          lake build KnownEdgeTwentyThree
          lake build StateLawTwentyThree
          lake build TrackThetaSharp
          lake build TrackQuantitativeRepairNineteen
          lake build NoveltyAwareLassoTwentyOne
          lake build KnownEdgeTwentyOne
          lake build StateLawTwentyOne
          lake build TrackThetaCaptureSharp
          if [ -f TrackThetaSharper.lean ]; then lake build TrackThetaSharper; fi
          if [ -f TrackQuantitativeRepairEighteen.lean ]; then lake build TrackQuantitativeRepairEighteen; fi
          if [ -f NoveltyAwareLassoTwenty.lean ]; then lake build NoveltyAwareLassoTwenty; fi
          if [ -f KnownEdgeTwenty.lean ]; then lake build KnownEdgeTwenty; fi
          if [ -f StateLawTwenty.lean ]; then lake build StateLawTwenty; fi
