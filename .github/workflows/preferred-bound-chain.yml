name: Preferred strict-bound Lean chain
on:
  push:
    branches: [agent/linear-bound-current]
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build established support base
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build ThreeQuarterArithmetic SupportMove HiddenAbsorb GrayTailCount
      - name: Build unconditional strict-bound endpoint
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build StateLaw FiniteFrameSwitchCorollary
          mkdir -p .lake/build/lib/lean
          lake env lean ConcreteEchoBridge.lean \
            -o .lake/build/lib/lean/ConcreteEchoBridge.olean
          lake env lean ConcreteCascadeFacts.lean \
            -o .lake/build/lib/lean/ConcreteCascadeFacts.olean
          lake env lean ConcreteFiniteBounds.lean
      - name: Build automatic component chain
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build LobeForestPartition
