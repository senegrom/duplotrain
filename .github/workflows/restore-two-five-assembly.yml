name: Restore unified 2N+5 assembly

on:
  push:
    branches: [agent/upper-bound-unified]
    paths:
      - .github/workflows/restore-two-five-assembly.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Codex assembly and adapt unified import
        run: |
          git show d615f15a2249933dc27d528ac6b4c87b508a4f7e:theory/lean/MellitFiveNoveltyAssembly.lean \
            > theory/lean/MellitFiveNoveltyAssembly.lean
          python - <<'PY'
          from pathlib import Path

          path = Path('theory/lean/StateLawTwoFive.lean')
          text = path.read_text()
          old = 'import StateLawTwoSharp\n'
          new = 'import CodexStateLawTwoSharp\n'
          if old not in text:
              raise SystemExit('StateLawTwoFive import line not found')
          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add theory/lean/MellitFiveNoveltyAssembly.lean theory/lean/StateLawTwoFive.lean
          git diff --cached --check
          git commit -m "restore unified two-reflector N+5 assembly"
          git push origin HEAD:agent/upper-bound-unified
