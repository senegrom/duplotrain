name: Push below coefficient 17
on:
  push:
    branches: [agent/push-below-17]
    paths:
      - theory/lean/PairTongueCountSharp.lean
      - theory/lean/CompleteRepairTongueCountSharp.lean
      - theory/lean/TwoJourneyTailCountSharp.lean
      - theory/lean/KnownEdgeFifteen.lean
      - theory/lean/StateLawFifteen.lean
      - .github/workflows/push-below-17-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register experimental targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "PairTongueCountSharp"
          [[lean_lib]]
          name = "CompleteRepairTongueCountSharp"
          [[lean_lib]]
          name = "TwoJourneyTailCountSharp"
          [[lean_lib]]
          name = "KnownEdgeFifteen"
          [[lean_lib]]
          name = "StateLawFifteen"
          EOF
      - name: Build available targets
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build PairTongueCountSharp
          lake build CompleteRepairTongueCountSharp
          lake build TwoJourneyTailCountSharp
          if [ -f KnownEdgeFifteen.lean ]; then lake build KnownEdgeFifteen; fi
          if [ -f StateLawFifteen.lean ]; then lake build StateLawFifteen; fi
