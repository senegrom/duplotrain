name: Finite component trap Lean check
on:
  push:
    branches: [agent/linear-bound-current]
    paths:
      - theory/lean/ExternalLobeRoundtrip.lean
      - theory/lean/ExternalLobeReflectionCore.lean
      - theory/lean/FiniteFullyLobedComponentTrap.lean
      - .github/workflows/finite-component-trap-check.yml
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theory/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Register theorem targets
        run: |
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "ExternalLobeRoundtrip"
          [[lean_lib]]
          name = "ExternalLobeReflectionCore"
          [[lean_lib]]
          name = "FiniteFullyLobedComponentTrap"
          EOF
      - name: Build finite trap theorem
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build FiniteFullyLobedComponentTrap
