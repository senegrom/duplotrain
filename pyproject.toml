[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duplotrain"
version = "0.1.0"
description = "Model LEGO DUPLO train track and find closed layouts that loop nicely."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "senegrom" }]
keywords = ["lego", "duplo", "train", "track", "layout", "geometry"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
render = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "matplotlib>=3.8", "ruff>=0.6"]

[project.scripts]
duplotrain = "duplotrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duplotrain = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running full enumerations (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
